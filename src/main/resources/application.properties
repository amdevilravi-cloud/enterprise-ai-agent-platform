server.port=8081
spring.application.name=agent-platform

# Database Configuration (Agent Context)
spring.datasource.url=jdbc:postgresql://localhost:5432/agent_db
spring.datasource.username=workspace
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# LLM Configuration
app.llm.provider=openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4-mini

# Default to localhost for local development; override LM_STUDIO_URL if needed
spring.ai.openai.base-url=${LM_STUDIO_URL:http://192.168.1.12:1234}
# LM Studio doesn't require an API key, but Spring AI expects one
# You can use a dummy value like "not-needed" or any placeholder


# Knowledge Platform Integration
knowledge.platform.url=http://localhost:8080

# Logging
logging.level.com.enterprise.ai.agent=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.config=classpath:logback-spring.xml

# Agent Runtime Configuration
agent.confidence.threshold=0.4
agent.max.retries=3
agent.retry.delay.ms=1000
agent.duplicate.similarity.threshold=0.8
agent.circuit.breaker.threshold=5
agent.stuck.iteration.threshold=8

# Knowledge Memory Configuration
knowledge.query.dedup.window.ms=30000
knowledge.max.recent.queries=100

# Knowledge Search Tool Configuration
knowledge.search.cache.expiry.ms=60000
knowledge.search.max.cache.size=50

# Execution Context Configuration
context.max.observations=50
context.max.tool.results=50
context.max.knowledge.references=100
context.max.retry.history=20
context.max.variables=100
context.batch.save.threshold=5

# Planner Configuration
planner.cache.enabled=false
planner.cache.ttl.minutes=5
planner.stuck.iteration.threshold=3
