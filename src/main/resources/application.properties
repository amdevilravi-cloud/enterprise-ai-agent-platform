server.port=8081
spring.application.name=agent-platform

# Database Configuration (Agent Context)
spring.datasource.url=jdbc:postgresql://localhost:5432/agent_db
spring.datasource.username=workspace
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# LLM Configuration
app.llm.provider=openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4-mini

# Default to localhost for local development; override LM_STUDIO_URL if needed
spring.ai.openai.base-url=${LM_STUDIO_URL:http://192.168.1.13:1234}
# LM Studio doesn't require an API key, but Spring AI expects one
# You can use a dummy value like "not-needed" or any placeholder


# Knowledge Platform Integration
knowledge.platform.url=http://localhost:8080

# Logging
logging.level.com.enterprise.ai.agent=DEBUG
logging.level.org.springframework.ai=DEBUG
